<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Milestone 4: Three-question Quiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="quiz-container">
    <header class="quiz-header">
      <h1>Three-question quiz</h1>
      <div class="progress-wrapper">
        <div class="progress-container" aria-hidden="true">
          <div id="progress-bar" class="progress-bar" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
        <p id="progress-text" class="progress-text" aria-live="polite">Question 1 of 3</p>
      </div>
    </header>

    <section class="card quiz-card" aria-labelledby="question">
      <h2 id="question"></h2>
      <div id="answers" class="answers-container" role="group" aria-label="Answer options"></div>
      <p id="feedback" class="feedback" role="status" aria-live="assertive"></p>
      <div class="actions">
        <button id="next" class="btn btn-primary">Next</button>
        <button id="restart" class="btn btn-secondary" hidden>Restart Quiz</button>
      </div>
      <p id="score" class="score-display" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
